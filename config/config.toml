# clanker's base runtime configuration. `mise run check:config` (see
# mise.toml/prek.toml) validates it in this repository's own CI with
# `clanker doctor`.
#
# Installing it: place (or symlink) this file at
# ${CLANKER_CONFIG:-~/.config/clanker/config.toml}. Machine-specific overrides,
# including the credentials each domain may see, go in a sibling `local.toml`
# next to wherever this file is installed (clanker deep-merges it automatically
# if present; see `clanker::config::load_config`) -- do not edit this file per
# machine.
[defaults]
domain = "eng"
contexts = ["work", "personal"]
# Directory prepended to PATH for every launch, ahead of the ambient PATH, so
# that wrapper scripts placed there shadow the real tools. The field is
# required by the config schema; pointing it at an empty or absent directory
# switches the mechanism off, which is the shipped default. Wrappers are not an
# enforcement boundary: a command can always name another path.
shim_path = "~/.local/share/clanker/shims"
sandbox_wrapper = "~/.config/sandbox-exec/run-sandboxed.sh"
prompter_bundle = "~/.local/prompter"
prompt_cache = "~/.cache/clanker/prompts"
prompt_cache_ttl_seconds = 86400

[harness.claude]
bin = "claude"
family = "claude"
default_args = ["--dangerously-skip-permissions"]

[harness.claude.injection]
kind = "arg-text"
args = ["--append-system-prompt", "{text}"]

[harness.claude.config_dir]
environment = "CLAUDE_CONFIG_DIR"
path = "~/.config/claude/{context}"

[harness.codex]
bin = "codex"
family = "gpt"
default_args = ["-s", "danger-full-access"]

[harness.codex.injection]
kind = "arg-file"
args = ["-c", "model_instructions_file={file}"]

[harness.codex.config_dir]
environment = "CODEX_HOME"
path = "~/.config/codex/{context}"

[harness.opencode]
bin = "opencode"
family = "gpt"
default_args = []

[harness.opencode.injection]
kind = "opencode-instructions"
environment = "OPENCODE_CONFIG_CONTENT"

[harness.opencode.config_dir]
environment = "OPENCODE_CONFIG_DIR"
path = "~/.config/opencode/{context}"

# Pi keeps one configuration directory for all of its providers, auth, and
# model selection, so it is restricted to a single context. No provider
# credential is granted automatically.
[harness.pi]
bin = "pi"
family = "deepseek"
contexts = ["personal"]
default_args = []

[harness.pi.injection]
kind = "arg-file"
args = ["--append-system-prompt", "{file}"]

[harness.pi.config_dir]
environment = "PI_CODING_AGENT_DIR"
path = "~/.pi/agent"

[model.opus]
harness = "claude"
family = "claude"
env = {}
harness_args = ["--model", "opus"]

[model.sonnet]
harness = "claude"
family = "claude"
env = {}
harness_args = ["--model", "sonnet"]

[model.haiku]
harness = "claude"
family = "claude"
env = {}
harness_args = ["--model", "haiku"]

[domain.eng]
profiles = ["core.base", "domain.eng"]
env = {}
credentials = []

[domain.writing]
profiles = ["core.base", "domain.writing"]
env = {}
credentials = []

[domain.research]
profiles = ["core.base", "domain.research"]
env = {}
credentials = []

[domain.admin]
profiles = ["core.base", "domain.admin"]
env = {}
credentials = []
