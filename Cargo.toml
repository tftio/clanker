[package]
name = "tftio-clanker"
version = "0.12.2"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Launch AI harnesses with runtime-configured context, domains, models, and prompts"
readme = "README.md"
repository = "https://github.com/tftio/clanker"
homepage = "https://github.com/tftio/clanker"
keywords = ["cli", "ai", "launcher", "prompt"]
categories = ["command-line-utilities", "development-tools"]
# Not published to crates.io while the GitHub repository is the distribution
# channel. Revisit before re-enabling.
publish = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
dbg_macro = "deny"
enum_glob_use = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
missing_errors_doc = "deny"
missing_panics_doc = "deny"

[lib]
name = "clanker"
path = "src/lib.rs"

[[bin]]
name = "clanker"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
clap_complete = "4.6.12"
colored = "3.1.1"
dirs = "7.0.0"
is-terminal = "0.4.17"
jiff = "0.2.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tftio-lib = "0.4.3"
thiserror = "2.0.21"
toml = "1.2.2"
uuid = { version = "1.29.3", features = ["v7"] }

[dev-dependencies]
tempfile = "3.27.0"
